<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Free Transform Image</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      height: 100%;
      background: black;
    }

    #camera {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
    }

    #overlay-container {
      position: absolute;
      top: 200px;
      left: 50px;
      width: 200px;
      height: 200px;
      z-index: 2;
      transform-origin: top left;
      touch-action: none;
    }

    #overlay-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .handle {
      width: 20px;
      height: 20px;
      background: white;
      border: 2px solid black;
      position: absolute;
      z-index: 3;
      border-radius: 50%;
      touch-action: none;
    }

    .tl { top: -10px; left: -10px; }
    .tr { top: -10px; right: -10px; }
    .bl { bottom: -10px; left: -10px; }
    .br { bottom: -10px; right: -10px; }
  </style>
</head>
<body>

<video id="camera" autoplay playsinline></video>

<div id="overlay-container">
  <img src="product.png" id="overlay-img" />
  <div class="handle tl" data-corner="tl"></div>
  <div class="handle tr" data-corner="tr"></div>
  <div class="handle bl" data-corner="bl"></div>
  <div class="handle br" data-corner="br"></div>
</div>

<script>
  const video = document.getElementById('camera');
  const overlay = document.getElementById('overlay-container');
  const handles = document.querySelectorAll('.handle');

  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
    .then(stream => { video.srcObject = stream; });

  let isDragging = false;
  let isResizing = false;
  let currentHandle = null;
  let offsetX, offsetY;
  let originalRect;

  const startDrag = (e) => {
    if (e.target.classList.contains('handle')) {
      isResizing = true;
      currentHandle = e.target.dataset.corner;
    } else {
      isDragging = true;
      const rect = overlay.getBoundingClientRect();
      offsetX = getPos(e).x - rect.left;
      offsetY = getPos(e).y - rect.top;
    }
    originalRect = overlay.getBoundingClientRect();
  };

  const doDrag = (e) => {
    if (isDragging) {
      const x = getPos(e).x - offsetX;
      const y = getPos(e).y - offsetY;
      overlay.style.left = `${x}px`;
      overlay.style.top = `${y}px`;
    }

    if (isResizing && currentHandle) {
      const pos = getPos(e);
      const dx = pos.x - originalRect.left;
      const dy = pos.y - originalRect.top;

      switch (currentHandle) {
        case 'tl':
          overlay.style.width = `${originalRect.right - pos.x}px`;
          overlay.style.height = `${originalRect.bottom - pos.y}px`;
          overlay.style.left = `${pos.x}px`;
          overlay.style.top = `${pos.y}px`;
          break;
        case 'tr':
          overlay.style.width = `${pos.x - originalRect.left}px`;
          overlay.style.height = `${originalRect.bottom - pos.y}px`;
          overlay.style.top = `${pos.y}px`;
          break;
        case 'bl':
          overlay.style.width = `${originalRect.right - pos.x}px`;
          overlay.style.height = `${pos.y - originalRect.top}px`;
          overlay.style.left = `${pos.x}px`;
          break;
        case 'br':
          overlay.style.width = `${pos.x - originalRect.left}px`;
          overlay.style.height = `${pos.y - originalRect.top}px`;
          break;
      }
    }
  };

  const stopDrag = () => {
    isDragging = false;
    isResizing = false;
    currentHandle = null;
  };

  const getPos = (e) => {
    if (e.touches) {
      return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    } else {
      return { x: e.clientX, y: e.clientY };
    }
  };

  // Mouse support
  overlay.addEventListener('mousedown', startDrag);
  window.addEventListener('mousemove', doDrag);
  window.addEventListener('mouseup', stopDrag);

  // Touch support
  overlay.addEventListener('touchstart', startDrag);
  window.addEventListener('touchmove', doDrag);
  window.addEventListener('touchend', stopDrag);
</script>

</body>
</html>
